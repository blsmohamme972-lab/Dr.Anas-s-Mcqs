<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101a34" />
    <meta name="description" content="A focused MCQ study workspace for vascular, thoracic, and cardiac surgery." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%234f46e5'/%3E%3Cpath d='M19 32h26M32 19v26' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Atlas MCQs</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <span></span>
            <span></span>
          </div>
          <div class="brand-copy">
            <strong>Atlas MCQs</strong>
            <small>Surgery MCQs</small>
          </div>
        </div>

        <div class="sidebar-section-label">Workspace</div>
        <nav class="sidebar-nav" aria-label="Workspace">
          <button class="nav-item is-active" data-nav="home" type="button">
            <span class="nav-icon" data-icon="home" aria-hidden="true"></span>
            <span>Home</span>
          </button>
          <button class="nav-item" data-nav="books" type="button">
            <span class="nav-icon" data-icon="book" aria-hidden="true"></span>
            <span>Books</span>
          </button>
          <button class="nav-item" data-nav="topics" type="button">
            <span class="nav-icon" data-icon="grid" aria-hidden="true"></span>
            <span>Topics</span>
          </button>
          <button class="nav-item" data-nav="study" type="button">
            <span class="nav-icon" data-icon="study" aria-hidden="true"></span>
            <span>Study</span>
          </button>
          <button class="nav-item" data-nav="exam" type="button">
            <span class="nav-icon" data-icon="exam" aria-hidden="true"></span>
            <span>Exam</span>
          </button>
        </nav>

        <div class="sidebar-section-label">Insights</div>
        <nav class="sidebar-nav" aria-label="Insights">
          <button class="nav-item" data-nav="progress" type="button">
            <span class="nav-icon" data-icon="chart" aria-hidden="true"></span>
            <span>Progress</span>
          </button>
          <button class="nav-item" data-nav="settings" type="button">
            <span class="nav-icon" data-icon="settings" aria-hidden="true"></span>
            <span>Settings</span>
          </button>
        </nav>
      </aside>

      <div class="app-frame">
        <header class="topbar">
          <div class="topbar-leading">
            <button class="icon-button menu-button" id="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
              <span data-icon="menu" aria-hidden="true"></span>
            </button>
            <div>
              <p class="eyebrow" id="topbar-eyebrow">Atlas MCQs</p>
              <h1 id="topbar-title">Home</h1>
            </div>
          </div>
          <div class="topbar-actions">
            <button class="icon-button" data-nav="settings" type="button" aria-label="Open settings">
              <span data-icon="settings" aria-hidden="true"></span>
            </button>
          </div>
        </header>

        <main id="main-content" tabindex="-1">
          <div id="app-view"></div>
        </main>
      </div>

      <nav class="mobile-nav" aria-label="Mobile navigation">
        <button class="mobile-nav-item is-active" data-nav="home" type="button">
          <span data-icon="home" aria-hidden="true"></span>
          <span>Home</span>
        </button>
        <button class="mobile-nav-item" data-nav="books" type="button">
          <span data-icon="book" aria-hidden="true"></span>
          <span>Books</span>
        </button>
        <button class="mobile-nav-item" data-nav="topics" type="button">
          <span data-icon="grid" aria-hidden="true"></span>
          <span>Topics</span>
        </button>
        <button class="mobile-nav-item mobile-nav-item--primary" data-nav="study" type="button">
          <span data-icon="study" aria-hidden="true"></span>
          <span>Study</span>
        </button>
        <button class="mobile-nav-item" data-nav="exam" type="button">
          <span data-icon="exam" aria-hidden="true"></span>
          <span>Exam</span>
        </button>

      </nav>
    </div>

    <noscript>
      <div class="noscript-message">
        Atlas MCQs needs JavaScript enabled to run the interactive study workspace.
      </div>
    </noscript>

    <script src="app.js"></script>
  </body>
</html>
